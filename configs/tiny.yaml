model:
  vocab_size: 4096
  max_seq_len: 512
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 4
  grad_accum_steps: 4
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 50
  max_steps: 1000
  grad_clip: 1.0
  log_every: 10
  save_every: 100
  seed: 42

data:
  train: data/train.txt
  eval: data/eval.txt
  tokenizer: artifacts/tokenizer.json
  seq_len: 512

runtime:
  device: auto
  dtype: bf16
  output_dir: artifacts/checkpoints
